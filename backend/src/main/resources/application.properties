server.port=${PORT:${SERVER_PORT:8080}}

# MySQL Database Configuration (Supports Local, Custom JDBC, and Railway Native MySQL Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:campusvault}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:password}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
jwt.secret=${JWT_SECRET:4c616d7075735661756c745365637572654a77745365637265744b657932303236303432314175576562}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application & Verification URL Configuration
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com,https://*.railway.app,https://*.up.railway.app}
app.storage.upload-dir=${STORAGE_UPLOAD_DIR:./storage}

# Default Admin Credentials for controlled seed
app.init.admin.email=${ADMIN_INIT_EMAIL:admin@campusvault.edu}
app.init.admin.password=${ADMIN_INIT_PASSWORD:Admin@123}
app.init.admin.name=${ADMIN_INIT_NAME:System Administrator}
app.init.seed-sample-data=${SEED_SAMPLE_DATA:true}

# Multipart / File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
